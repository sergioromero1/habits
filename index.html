<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitSpark</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <meta name="theme-color" content="#6366f1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <!-- Firebase SDKs (Compat for simple local testing support) -->
    <!-- Using version based on user snippet but falling back to stable 10.x if 12.x not standard yet in compat CDN, 
         actually standard CDN is usually maxed at latest stable. Let's use 10.7.1 for stability or try the one provided if mapped.
         Using 10.7.1 is extremely safe for compat. -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
</head>

<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>HabitSpark</h1>
            </div>

            <!-- User Auth Area -->
            <div id="user-area" class="user-area">
                <button id="login-btn" class="btn-primary-sm">Iniciar Sesión</button>
                <div id="user-profile" class="hidden">
                    <img id="user-avatar" src="" alt="Avatar" class="avatar-sm">
                    <div class="dropdown-menu">
                        <button id="export-btn">💾 Descargar Datos</button>
                        <button id="logout-btn" class="text-danger">Cerrar Sesión</button>
                    </div>
                </div>
            </div>

            <nav class="main-nav">
                <button class="nav-btn active" data-view="daily">Hoy</button>
                <button class="nav-btn" data-view="calendar">Calendario</button>
                <button class="nav-btn" data-view="progress">Progreso</button>
            </nav>
            <button id="theme-toggle" class="icon-btn" aria-label="Cambiar tema">🌙</button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Dynamic Content will be injected here -->
        </main>

        <!-- Floating Action Button -->
        <button id="add-habit-btn" class="fab" aria-label="Nuevo Hábito">+</button>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden">
        <div class="modal" id="add-habit-modal">
            <h2>Nuevo Hábito</h2>
            <form id="add-habit-form">
                <div class="input-group">
                    <label for="habit-name">Nombre del Hábito</label>
                    <input type="text" id="habit-name" placeholder="Ej: Leer 30 minutos" required>
                </div>
                <div class="input-group">
                    <label for="habit-color">Color</label>
                    <div class="color-picker">
                        <!-- Extended Palette -->
                        <input type="radio" name="color" value="#FF6B6B" id="color-1" checked>
                        <label for="color-1" style="--bg: #FF6B6B" title="Red"></label>

                        <input type="radio" name="color" value="#4ECDC4" id="color-2">
                        <label for="color-2" style="--bg: #4ECDC4" title="Teal"></label>

                        <input type="radio" name="color" value="#FFE66D" id="color-3">
                        <label for="color-3" style="--bg: #FFE66D" title="Yellow"></label>

                        <input type="radio" name="color" value="#1A535C" id="color-4">
                        <label for="color-4" style="--bg: #1A535C" title="Navy"></label>

                        <input type="radio" name="color" value="#F9844A" id="color-5">
                        <label for="color-5" style="--bg: #F9844A" title="Orange"></label>

                        <input type="radio" name="color" value="#9D4EDD" id="color-6">
                        <label for="color-6" style="--bg: #9D4EDD" title="Purple"></label>

                        <input type="radio" name="color" value="#FF006E" id="color-7">
                        <label for="color-7" style="--bg: #FF006E" title="Pink"></label>

                        <input type="radio" name="color" value="#3A86FF" id="color-8">
                        <label for="color-8" style="--bg: #3A86FF" title="Blue"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-text" id="cancel-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear Hábito</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
