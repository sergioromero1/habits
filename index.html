<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habit Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">✨</span>
                <h1>HabitSpark</h1>
            </div>
            <nav class="main-nav">
                <button class="nav-btn active" data-view="daily">Hoy</button>
                <button class="nav-btn" data-view="calendar">Calendario</button>
                <button class="nav-btn" data-view="progress">Progreso</button>
            </nav>
            <button id="theme-toggle" class="icon-btn" aria-label="Cambiar tema">🌙</button>
        </header>

        <!-- Main Content Area -->
        <main id="main-content">
            <!-- Dynamic Content will be injected here -->
        </main>

        <!-- Floating Action Button -->
        <button id="add-habit-btn" class="fab" aria-label="Nuevo Hábito">+</button>
    </div>

    <!-- Modals -->
    <div id="modal-overlay" class="hidden">
        <div class="modal" id="add-habit-modal">
            <h2>Nuevo Hábito</h2>
            <form id="add-habit-form">
                <div class="input-group">
                    <label for="habit-name">Nombre del Hábito</label>
                    <input type="text" id="habit-name" placeholder="Ej: Leer 30 minutos" required>
                </div>
                <div class="input-group">
                    <label for="habit-color">Color</label>
                    <div class="color-picker">
                        <input type="radio" name="color" value="#FF6B6B" id="color-1" checked>
                        <label for="color-1" style="--bg: #FF6B6B"></label>
                        
                        <input type="radio" name="color" value="#4ECDC4" id="color-2">
                        <label for="color-2" style="--bg: #4ECDC4"></label>
                        
                        <input type="radio" name="color" value="#FFE66D" id="color-3">
                        <label for="color-3" style="--bg: #FFE66D"></label>
                        
                        <input type="radio" name="color" value="#1A535C" id="color-4">
                        <label for="color-4" style="--bg: #1A535C"></label>

                        <input type="radio" name="color" value="#F9844A" id="color-5">
                        <label for="color-5" style="--bg: #F9844A"></label>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-text" id="cancel-modal">Cancelar</button>
                    <button type="submit" class="btn-primary">Crear Hábito</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
